<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
    }
    h1 { margin-top: 0; }
    .entrada { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 1rem;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #4f9cf9;
      color: #0d1117;
      font-weight: bold;
      cursor: pointer;
    }
    ul { list-style: none; padding: 0; margin: 20px 0 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #30363d;
      cursor: pointer;
    }
    li.feita span { text-decoration: line-through; color: #6e7681; }
    li button { background: #da3633; color: white; padding: 4px 10px; }
    .voltar { display: inline-block; margin-top: 20px; color: #4f9cf9; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Lista de Tarefas</h1>

    <div class="entrada">
      <input id="campo" type="text" placeholder="Digite uma tarefa...">
      <button onclick="adicionar()">Adicionar</button>
    </div>

    <ul id="lista"></ul>

    <a class="voltar" href="../">← Voltar ao portfólio</a>
  </div>

  <script>
    // Pega as tarefas guardadas no navegador (ou começa com lista vazia)
    let tarefas = JSON.parse(localStorage.getItem("tarefas")) || [];

    const campo = document.getElementById("campo");
    const lista = document.getElementById("lista");

    // Permite adicionar apertando Enter
    campo.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter") adicionar();
    });

    function salvar() {
      localStorage.setItem("tarefas", JSON.stringify(tarefas));
    }

    function adicionar() {
      const texto = campo.value.trim();
      if (texto === "") return;
      tarefas.push({ texto: texto, feita: false });
      campo.value = "";
      salvar();
      mostrar();
    }

    function alternar(posicao) {
      tarefas[posicao].feita = !tarefas[posicao].feita;
      salvar();
      mostrar();
    }

    function apagar(posicao) {
      tarefas.splice(posicao, 1);
      salvar();
      mostrar();
    }

    function mostrar() {
      lista.innerHTML = "";
      tarefas.forEach(function (tarefa, posicao) {
        const item = document.createElement("li");
        if (tarefa.feita) item.classList.add("feita");

        const texto = document.createElement("span");
        texto.textContent = tarefa.texto;
        item.onclick = function () { alternar(posicao); };

        const botao = document.createElement("button");
        botao.textContent = "Apagar";
        botao.onclick = function (evento) {
          evento.stopPropagation();
          apagar(posicao);
        };

        item.appendChild(texto);
        item.appendChild(botao);
        lista.appendChild(item);
      });
    }

    mostrar();
  </script>
</body>
</html>
